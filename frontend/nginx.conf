server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No trailing path after the port: nginx forwards the original request
    # URI unchanged, so /api/generate-report reaches the backend as
    # /api/generate-report (FastAPI mounts its router at that same prefix).
    # A trailing "/" here would strip "/api" and 404 every request.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
